[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-generation-replication"
version = "0.1.0"
description = "Auditable causal hypothesis generation research workflow"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
notebooks = ["nbformat>=5", "nbclient>=0.10", "nbconvert>=7"]
